<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>気になるワード - スクリーン</title>
<style>
  :root { --panel: rgba(255,255,255,.92); --ink:#1d2433; --sub:#5b6577; --side: 300px; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; overflow:hidden; font-family: system-ui, -apple-system, "Hiragino Sans", "Yu Gothic UI", sans-serif; }
  body { background: radial-gradient(ellipse at 40% 45%, #ffffff 0%, #f3f5f8 70%, #e9edf2 100%); color: var(--ink); }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  aside { position: fixed; top: 16px; right: 16px; bottom: 16px; width: var(--side); padding: 20px;
          background: var(--panel); border-radius: 20px; box-shadow: 0 8px 32px rgba(0,30,60,.12);
          display: flex; flex-direction: column; gap: 14px; }
  h1 { margin: 0; font-size: 1.35rem; line-height: 1.3; }
  .total { color: var(--sub); font-size: 1rem; }
  .total b { color: var(--ink); font-size: 1.8rem; margin: 0 4px; }
  ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; flex: 1; overflow: hidden; }
  ol li { display: grid; grid-template-columns: 1.8em 1fr auto; align-items: center; gap: 8px; font-size: 1.05rem; }
  ol .rank { font-weight: 800; color: var(--sub); text-align: center; }
  ol li:nth-child(-n+3) .rank { color: #e0a400; }
  ol .word { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
  ol .bar { grid-column: 2 / 4; height: 6px; border-radius: 3px; margin-top: -4px; }
  ol .cnt { font-variant-numeric: tabular-nums; font-weight: 700; }
  .join { text-align: center; border-top: 1px solid rgba(0,0,0,.08); padding-top: 12px; }
  .join p { margin: 0 0 8px; font-weight: 700; }
  #qr { display: inline-block; background: #fff; padding: 8px; border-radius: 8px; }
  #qr:empty { display: none; }
  #url { font-size: .9rem; word-break: break-all; color: var(--sub); margin-top: 6px; }
  .empty { position: fixed; left: 0; right: calc(var(--side) + 32px); top: 45%; text-align: center;
           font-size: 2rem; font-weight: 700; color: rgba(30,40,60,.35); pointer-events: none; }
  body.hide-side aside { display: none; }
  body.hide-side .empty { right: 0; }
  @media (max-width: 800px) { :root { --side: 0px; } aside { display: none; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="empty" id="empty">回答を待っています…</div>
<aside>
  <h1>会場の気になるワード</h1>
  <div class="total">回答数<b id="total">0</b>件</div>
  <ol id="rank"></ol>
  <div class="join">
    <p>スマホから回答できます</p>
    <div id="qr"></div>
    <div id="url"></div>
  </div>
</aside>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
// ワード1つ＝円1つ。円の面積が回答数に比例し、回答が増えると円が大きくなる。
const POLL_MS = 1500;       // 集計の取得間隔
const FILL = 0.5;           // 表示エリアのうち円で埋める割合の目安
const MIN_R = 20;           // 最小の円の半径（回答1件でも文字が読める大きさ）
const PALETTE = [           // 青・橙・緑・紫・灰の濃淡（参考画像の配色）
  '#3182bd','#6baed6','#9ecae1','#c6dbef','#e6550d','#fd8d3c','#fdae6b','#fdd0a2',
  '#31a354','#74c476','#a1d99b','#c7e9c0','#756bb1','#9e9ac8','#bcbddc','#dadaeb',
  '#636363','#969696','#bdbdbd','#d9d9d9'];

const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
let W = 0, H = 0, DPR = 1, SIDE = 0, version = -1, words = [];
const nodes = new Map();    // key -> {word, count, x, y, vx, vy, r, tr, color, pulse}
const FONT = '"Hiragino Sans", "Yu Gothic UI", system-ui, sans-serif';

function hashColor(key) {
  let h = 0; for (const ch of key) h = (h * 31 + ch.codePointAt(0)) >>> 0;
  return PALETTE[h % PALETTE.length];
}
function isDark(hex) {
  const n = parseInt(hex.slice(1), 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  return 0.299 * r + 0.587 * g + 0.114 * b < 150;
}
function areaW() { return W - SIDE; }

function resize() {
  DPR = window.devicePixelRatio || 1;
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * DPR; canvas.height = H * DPR;
  const side = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--side')) || 0;
  SIDE = document.body.classList.contains('hide-side') || side === 0 ? 0 : side + 32;
  updateTargets();
}

// 円の目標半径：面積が回答数に比例。全体が表示エリアに収まるよう縮尺を決める
function updateTargets() {
  const total = words.reduce((s, w) => s + w.count, 0);
  if (!total) return;
  const area = areaW() * H * FILL;
  let k = Math.sqrt(area / (Math.PI * total));
  const maxR = Math.min(areaW(), H) * 0.33;
  if (words.length) k = Math.min(k, maxR / Math.sqrt(words[0].count));
  for (const w of words) {
    const n = nodes.get(w.key);
    if (n) n.tr = Math.max(MIN_R, k * Math.sqrt(w.count));
  }
}

function sync(data) {
  words = data.words;
  document.getElementById('total').textContent = data.total;
  document.getElementById('empty').style.display = words.length ? 'none' : '';
  const keep = new Set();
  const cx = areaW() / 2, cy = H / 2;
  for (const w of words) {
    keep.add(w.key);
    let n = nodes.get(w.key);
    if (!n) {   // 新しいワード：中央付近の外側から小さく現れて大きくなる
      const a = Math.random() * Math.PI * 2, d = Math.min(areaW(), H) * 0.45;
      n = { x: cx + Math.cos(a) * d, y: cy + Math.sin(a) * d, vx: 0, vy: 0, r: 0, tr: MIN_R,
            color: hashColor(w.key), count: 0, pulse: 0 };
      nodes.set(w.key, n);
    }
    if (n.count && w.count > n.count) n.pulse = 1;   // 回答が増えたら一瞬光らせる
    n.word = w.word; n.count = w.count;
  }
  for (const k of [...nodes.keys()]) if (!keep.has(k)) nodes.delete(k);
  updateTargets();
  renderRanking();
}

function renderRanking() {
  const ol = document.getElementById('rank'); ol.innerHTML = '';
  const max = words.length ? words[0].count : 1;
  words.slice(0, 10).forEach((w, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="rank">${i + 1}</span><span class="word"></span><span class="cnt">${w.count}</span>
                    <span class="bar" style="background:${hashColor(w.key)};width:${Math.max(4, 100 * w.count / max)}%"></span>`;
    li.querySelector('.word').textContent = w.word;
    ol.appendChild(li);
  });
}

async function poll() {
  try {
    const d = await (await fetch('/api/words', { cache: 'no-store' })).json();
    if (d.version !== version) { version = d.version; sync(d); }
  } catch (e) { /* 一時的な通信断は無視して次回再取得 */ }
  setTimeout(poll, POLL_MS);
}

// ---- 物理：中央へ引き寄せ、円同士は重ならないよう押し合う ----
function step() {
  const list = [...nodes.values()], cx = areaW() / 2, cy = H / 2, aspect = Math.max(1, areaW() / H);
  for (const n of list) {
    n.r += (n.tr - n.r) * 0.08;
    n.vx += (cx - n.x) * 0.0016 / aspect; n.vy += (cy - n.y) * 0.0016;
    n.vx *= 0.82; n.vy *= 0.82; n.x += n.vx; n.y += n.vy;
    n.pulse = Math.max(0, n.pulse - 0.02);
  }
  for (let it = 0; it < 4; it++) {
    for (let i = 0; i < list.length; i++) {
      const a = list[i];
      for (let j = i + 1; j < list.length; j++) {
        const b = list[j], dx = b.x - a.x, dy = b.y - a.y, min = a.r + b.r + 4;
        const d2 = dx * dx + dy * dy;
        if (d2 >= min * min) continue;
        const d = Math.sqrt(d2) || 0.01, push = (min - d) / d / 2;
        const wa = b.r / (a.r + b.r || 1), wb = 1 - wa;   // 小さい円ほど大きく動く
        a.x -= dx * push * wa * 2; a.y -= dy * push * wa * 2;
        b.x += dx * push * wb * 2; b.y += dy * push * wb * 2;
      }
    }
    for (const n of list) {   // 表示エリアからはみ出さない
      n.x = Math.min(Math.max(n.x, n.r + 8), areaW() - n.r - 8);
      n.y = Math.min(Math.max(n.y, n.r + 8), H - n.r - 8);
    }
  }
  return list;
}

function setFont(size, weight = 700) { ctx.font = `${weight} ${size}px ${FONT}`; }
function splitWord(word) {   // 長いワードは2行に
  const chars = [...word];
  if (chars.length <= 6) return [word];
  const sp = [...word.matchAll(/ /g)].map(m => m.index);
  if (sp.length) {
    const mid = word.length / 2, i = sp.reduce((a, b) => Math.abs(b - mid) < Math.abs(a - mid) ? b : a);
    return [word.slice(0, i), word.slice(i + 1)];
  }
  const h = Math.ceil(chars.length / 2);
  return [chars.slice(0, h).join(''), chars.slice(h).join('')];
}
function fitSize(lines, maxW, start) {
  let size = start;
  for (; size > 8; size--) {
    setFont(size);
    if (lines.every(l => ctx.measureText(l).width <= maxW)) break;
  }
  return size;
}

function drawNode(n) {
  if (n.r < 1) return;
  ctx.beginPath(); ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2);
  ctx.fillStyle = n.color; ctx.fill();
  if (n.pulse > 0) {
    ctx.lineWidth = 4 + 8 * n.pulse; ctx.strokeStyle = `rgba(255,200,0,${n.pulse})`; ctx.stroke();
  }
  const dark = isDark(n.color);
  ctx.fillStyle = dark ? '#fff' : '#1d2433';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const single = fitSize([n.word], n.r * 1.6, Math.round(n.r * 0.5));
  const lines = single < n.r * 0.3 && [...n.word].length > 6 ? splitWord(n.word) : [n.word];
  const size = lines.length > 1 ? fitSize(lines, n.r * 1.5, Math.round(n.r * 0.42)) : single;
  const showCount = n.r > 34;
  const lh = size * 1.15, cnt = Math.max(10, Math.round(size * 0.55));
  const blockH = lines.length * lh + (showCount ? cnt * 1.3 : 0);
  let y = n.y - blockH / 2 + lh / 2;
  setFont(size);
  for (const l of lines) { ctx.fillText(l, n.x, y); y += lh; }
  if (showCount) {
    setFont(cnt, 600); ctx.globalAlpha = 0.8;
    ctx.fillText(`${n.count}件`, n.x, y - lh / 2 + cnt * 0.85);
    ctx.globalAlpha = 1;
  }
}

function frame() {
  const list = step();
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, W, H);
  list.sort((a, b) => a.r - b.r);   // 小さい円を後ろに
  for (const n of list) drawNode(n);
  requestAnimationFrame(frame);
}

// ---- 参加用の URL / QR ----
fetch('/api/info').then(r => r.json()).then(d => {
  document.getElementById('url').textContent = d.answer_url;
  if (window.QRCode) new QRCode(document.getElementById('qr'), { text: d.answer_url, width: 168, height: 168 });
}).catch(() => {});

// F キー：全画面、S キー：右パネルの表示切替
document.addEventListener('keydown', e => {
  if (e.key === 'f' || e.key === 'F') {
    if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen?.();
  } else if (e.key === 's' || e.key === 'S') {
    document.body.classList.toggle('hide-side'); resize();
  }
});
window.addEventListener('resize', resize);
resize(); poll(); requestAnimationFrame(frame);
</script>
</body>
</html>
