<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>気になるワード - スクリーン</title>
<style>
  :root { --panel: rgba(255,255,255,.88); --ink:#1d2433; --sub:#5b6577; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; overflow:hidden; font-family: system-ui, -apple-system, "Hiragino Sans", "Yu Gothic UI", sans-serif; }
  body { background: linear-gradient(180deg, #8fd3ff 0%, #c9ecff 55%, #f2fbff 100%); color: var(--ink); }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  aside { position: fixed; top: 16px; right: 16px; bottom: 16px; width: var(--side); padding: 20px;
          background: var(--panel); border-radius: 20px; box-shadow: 0 8px 32px rgba(0,40,80,.15);
          display: flex; flex-direction: column; gap: 14px; backdrop-filter: blur(6px); }
  h1 { margin: 0; font-size: 1.35rem; line-height: 1.3; }
  .total { color: var(--sub); font-size: 1rem; }
  .total b { color: var(--ink); font-size: 1.8rem; margin: 0 4px; }
  ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; flex: 1; overflow: hidden; }
  ol li { display: grid; grid-template-columns: 1.8em 1fr auto; align-items: center; gap: 8px; font-size: 1.05rem; }
  ol .rank { font-weight: 800; color: var(--sub); text-align: center; }
  ol li:nth-child(-n+3) .rank { color: #e0a400; }
  ol .word { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
  ol .bar { grid-column: 2 / 4; height: 6px; border-radius: 3px; margin-top: -4px; }
  ol .cnt { font-variant-numeric: tabular-nums; font-weight: 700; }
  .join { text-align: center; border-top: 1px solid rgba(0,0,0,.08); padding-top: 12px; }
  .join p { margin: 0 0 8px; font-weight: 700; }
  #qr { display: inline-block; background: #fff; padding: 8px; border-radius: 8px; }
  #qr:empty { display: none; }
  #url { font-size: .9rem; word-break: break-all; color: var(--sub); margin-top: 6px; }
  .empty { position: fixed; left: 0; right: calc(var(--side) + 32px); top: 45%; text-align: center;
           font-size: 2rem; font-weight: 700; color: rgba(0,50,90,.45); pointer-events: none; }
  body.hide-side aside { display: none; }
  body.hide-side .empty { right: 0; }
  :root { --side: 300px; }
  @media (max-width: 800px) { :root { --side: 0px; } aside { display: none; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="empty" id="empty">回答を待っています…</div>
<aside>
  <h1>🎈 会場の気になるワード</h1>
  <div class="total">回答数<b id="total">0</b>件</div>
  <ol id="rank"></ol>
  <div class="join">
    <p>スマホから回答できます</p>
    <div id="qr"></div>
    <div id="url"></div>
  </div>
</aside>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
// ---- 設定 ----
const POLL_MS = 1500;      // 集計の取得間隔
const CAP_PER_WORD = 40;   // 1ワードあたり描くバルーンの上限（超えた分は数字で表示）
const PALETTE = ['#ff6f61','#ffb400','#3ec27a','#2f9bff','#a66cff','#ff5fa2','#00b8b0','#ff8a3d','#6a7dff','#e94f4f','#8bc34a','#00a3e0'];

const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
let W = 0, H = 0, DPR = 1, SIDE = 0;
let words = [];                 // サーバーの集計（多い順）
const clusters = new Map();     // key -> {word, count, color, x, y, R, ax, ay}
let balloons = [];              // {key, x, y, vx, vy, born, phase}
let r = 40;                     // バルーン半径（すべて同じ大きさ。数が多いと全体を縮小）
let version = -1, firstLoad = true;

function hashColor(key) {
  let h = 0; for (const ch of key) h = (h * 31 + ch.codePointAt(0)) >>> 0;
  return PALETTE[h % PALETTE.length];
}
function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const f = c => Math.max(0, Math.min(255, Math.round(c + amt * 255)));
  return `rgb(${f(n >> 16)},${f((n >> 8) & 255)},${f(n & 255)})`;
}

function resize() {
  DPR = window.devicePixelRatio || 1;
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * DPR; canvas.height = H * DPR;
  const side = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--side')) || 0;
  SIDE = document.body.classList.contains('hide-side') || side === 0 ? 0 : side + 32;
  for (const c of clusters.values()) c.cx = undefined;   // 画面サイズが変わったら配置し直す
  layout();
}

// ---- ワードごとの「束」の配置：多い順に中央から渦巻き状に、重ならないよう置く ----
function pileRadius(n, rb) { return rb * (Math.sqrt(Math.min(n, CAP_PER_WORD)) * 1.12 + 0.2); }
function tagH(rb) { return Math.max(28, rb * 0.9); }
function tagSize(c, rb) {   // 札（ワード ×回答数）の大きさ。配置と描画で共通
  const label = `${c.word}  ×${c.count}`;
  const size = fitFont(label, Math.max(pileRadius(c.count, rb) * 2.4, 120), Math.round(Math.max(13, rb * 0.38 + Math.sqrt(c.count) * 1.5)));
  return { label, size, w: ctx.measureText(label).width + 20, h: Math.max(22, rb * 0.62) };
}
function tryLayout(rb) {
  const areaW = W - SIDE, pad = 12, top = 20;
  const cx0 = areaW / 2, cy0 = H / 2;
  const placed = [];
  for (const w of words) {
    const R = pileRadius(w.count, rb);
    const hw = Math.max(R + 4, tagSize(w, rb).w / 2 + 4), hh = R + rb * 0.9 + tagH(rb) * 0.5;   // 束（風船＋ひも＋札）の外接円の近似
    const F = Math.max(hw, hh);
    const fits = (x, y) => x - F >= pad && x + F <= areaW - pad && y - F >= top && y + F <= H - pad &&
                           placed.every(p => Math.hypot(p.x - x, p.y - y) > p.F + F + 6);
    const prev = clusters.get(w.key);   // 前回の位置に置けるならそのまま（束が飛び回らないように）
    if (prev && prev.cx !== undefined && fits(prev.cx, prev.cy)) { placed.push({ key: w.key, x: prev.cx, y: prev.cy, F, R }); continue; }
    let ok = false;
    for (let i = 0; i < 4000; i++) {
      const a = i * 0.35, d = i * rb * 0.06;
      const x = cx0 + Math.cos(a) * d * (areaW / H > 1 ? Math.min(areaW / H, 1.8) : 1);
      const y = cy0 + Math.sin(a) * d;
      if (d > Math.max(areaW, H)) break;
      if (fits(x, y)) {
        placed.push({ key: w.key, x, y, F, R }); ok = true; break;
      }
    }
    if (!ok) return null;
  }
  return placed;
}
function layout() {
  if (!W) return;
  let rb = Math.min(46, Math.max(18, Math.min(W - SIDE, H) / 14)), placed = null;
  if (r < rb && (placed = tryLayout(r))) rb = r;   // 縮小済みならその大きさを保つ（大きさが行き来しないように）
  else for (const c of clusters.values()) c.cx = undefined;
  while (!placed && rb >= 10 && !(placed = tryLayout(rb))) rb *= 0.9;
  if (!placed) placed = tryLayout(rb = 10) || [];
  r = rb;
  const keep = new Set();
  for (const p of placed) {
    const w = words.find(x => x.key === p.key);
    const c = clusters.get(p.key) || { color: hashColor(p.key) };
    Object.assign(c, { word: w.word, count: w.count, R: p.R, cx: p.x, cy: p.y, x: p.x, y: p.y - (p.F - p.R) * 0.55 });
    c.ax = c.x; c.ay = c.y + c.R + r * 0.9;   // ひもを束ねる位置（札の位置）
    clusters.set(p.key, c); keep.add(p.key);
  }
  for (const k of [...clusters.keys()]) if (!keep.has(k)) clusters.delete(k);
}

// ---- サーバーの集計とバルーン数を合わせる ----
function sync(data) {
  words = data.words;
  document.getElementById('total').textContent = data.total;
  document.getElementById('empty').style.display = words.length ? 'none' : '';
  renderRanking();
  layout();
  const have = new Map();
  for (const b of balloons) have.set(b.key, (have.get(b.key) || 0) + 1);
  const want = new Map(words.map(w => [w.key, Math.min(w.count, CAP_PER_WORD)]));
  balloons = balloons.filter(b => {          // 削除・リセットされた分を消す
    const n = want.get(b.key) || 0, h = have.get(b.key);
    if (h > n) { have.set(b.key, h - 1); return false; }
    return true;
  });
  const now = performance.now(); let delay = 0;
  for (const [key, n] of want) {
    const c = clusters.get(key); if (!c) continue;
    for (let i = have.get(key) || 0; i < n; i++) {
      balloons.push({ key, x: c.x + (Math.random() - .5) * c.R, y: H + r * 2 + Math.random() * 40,
                      vx: 0, vy: -4 - Math.random() * 3, born: now + delay, phase: Math.random() * Math.PI * 2 });
      if (firstLoad) delay += 25;
    }
  }
  firstLoad = false;
}

function renderRanking() {
  const ol = document.getElementById('rank'); ol.innerHTML = '';
  const max = words.length ? words[0].count : 1;
  words.slice(0, 10).forEach((w, i) => {
    const li = document.createElement('li');
    const color = hashColor(w.key);
    li.innerHTML = `<span class="rank">${i + 1}</span><span class="word"></span><span class="cnt">${w.count}</span>
                    <span class="bar" style="background:${color};width:${Math.max(4, 100 * w.count / max)}%"></span>`;
    li.querySelector('.word').textContent = w.word;
    ol.appendChild(li);
  });
}

async function poll() {
  try {
    const d = await (await fetch('/api/words', { cache: 'no-store' })).json();
    if (d.version !== version) { version = d.version; sync(d); }
  } catch (e) { /* 一時的な通信断は無視して次回再取得 */ }
  setTimeout(poll, POLL_MS);
}

// ---- 物理：束の中心へ引き寄せ、バルーン同士は押し合う ----
function step(now) {
  const live = balloons.filter(b => b.born <= now);
  for (const b of live) {
    const c = clusters.get(b.key); if (!c) continue;
    b.vx += (c.x - b.x) * 0.004; b.vy += (c.y - b.y) * 0.004 - 0.02;
  }
  const minD = r * 2.05;
  for (const b of live) {   // 自分の束から離れているバルーンは他の束をすり抜けて戻る
    const c = clusters.get(b.key);
    b.away = !c || Math.hypot(c.x - b.x, c.y - b.y) > c.R + r * 1.5;
  }
  for (let i = 0; i < live.length; i++) {
    const a = live[i];
    for (let j = i + 1; j < live.length; j++) {
      const b = live[j], dx = b.x - a.x, dy = b.y - a.y;
      if (a.key !== b.key && (a.away || b.away)) continue;
      if (Math.abs(dx) > minD || Math.abs(dy) > minD) continue;
      const d = Math.hypot(dx, dy) || 0.01;
      if (d < minD) {
        const k = (minD - d) / d * (a.key === b.key ? 0.12 : 0.25);
        a.vx -= dx * k; a.vy -= dy * k; b.vx += dx * k; b.vy += dy * k;
      }
    }
  }
  for (const b of live) { b.vx *= 0.86; b.vy *= 0.86; b.x += b.vx; b.y += b.vy; }
  return live;
}

function fitFont(text, maxW, start) {
  let size = start;
  ctx.font = `700 ${size}px system-ui, "Hiragino Sans", "Yu Gothic UI", sans-serif`;
  while (size > 7 && ctx.measureText(text).width > maxW) {
    size -= 1; ctx.font = `700 ${size}px system-ui, "Hiragino Sans", "Yu Gothic UI", sans-serif`;
  }
  return size;
}

// 長いワードは2行に分ける（空白があれば中央に近い空白で、なければ文字数の半分で）
function splitWord(word) {
  const chars = [...word];
  if (chars.length <= 5) return [word];
  const sp = [...word.matchAll(/ /g)].map(m => m.index);
  if (sp.length) {
    const mid = word.length / 2, i = sp.reduce((a, b) => Math.abs(b - mid) < Math.abs(a - mid) ? b : a);
    return [word.slice(0, i), word.slice(i + 1)];
  }
  const h = Math.ceil(chars.length / 2);
  return [chars.slice(0, h).join(''), chars.slice(h).join('')];
}

function drawBalloon(b, t, color, word) {
  const age = (t - b.born) / 400, s = age < 1 ? 0.4 + 0.6 * (1 - Math.pow(1 - age, 3)) : 1;
  const x = b.x + Math.sin(t / 900 + b.phase) * r * 0.06, y = b.y + Math.cos(t / 1100 + b.phase) * r * 0.05;
  const rx = r * s, ry = r * 1.12 * s;
  const g = ctx.createRadialGradient(x - rx * .35, y - ry * .4, rx * .1, x, y, ry * 1.1);
  g.addColorStop(0, shade(color, .28)); g.addColorStop(1, shade(color, -.12));
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath();                                       // 結び目
  ctx.moveTo(x, y + ry - 1); ctx.lineTo(x - rx * .12, y + ry + rx * .16); ctx.lineTo(x + rx * .12, y + ry + rx * .16);
  ctx.closePath(); ctx.fillStyle = shade(color, -.18); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.45)';               // ハイライト
  ctx.beginPath(); ctx.ellipse(x - rx * .38, y - ry * .42, rx * .16, ry * .24, -0.5, 0, Math.PI * 2); ctx.fill();
  if (s > 0.6) {                                         // バルーンの中にワード
    ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const lines = splitWord(word);
    const size = Math.min(...lines.map(l => fitFont(l, rx * 1.6, Math.round(r * (lines.length > 1 ? 0.38 : 0.42)))));
    ctx.font = `700 ${size}px system-ui, "Hiragino Sans", "Yu Gothic UI", sans-serif`;
    ctx.shadowColor = 'rgba(0,0,0,.25)'; ctx.shadowBlur = 3;
    lines.forEach((l, i) => ctx.fillText(l, x, y + (i - (lines.length - 1) / 2) * size * 1.1));
    ctx.shadowBlur = 0;
  }
  return { x, y: y + ry + rx * .16 };
}

function frame(t) {
  const live = step(t);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, W, H);
  live.sort((a, b) => a.y - b.y);
  // ひも（バルーンの下 → 札）
  ctx.lineWidth = 1.2;
  for (const b of live) {
    const c = clusters.get(b.key); if (!c) continue;
    const bx = b.x + Math.sin(t / 900 + b.phase) * r * 0.06, by = b.y + r * 1.3;
    ctx.strokeStyle = 'rgba(60,70,90,.35)';
    ctx.beginPath(); ctx.moveTo(bx, by);
    ctx.quadraticCurveTo((bx + c.ax) / 2 + Math.sin(t / 700 + b.phase) * 4, (by + c.ay) / 2, c.ax, c.ay); ctx.stroke();
  }
  for (const b of live) {
    const c = clusters.get(b.key); if (c) drawBalloon(b, t, c.color, c.word);
  }
  // 札（ワードと回答数）
  for (const c of clusters.values()) {
    const { label, w: tw, h: th } = tagSize(c, r);
    const x = c.ax - tw / 2, y = c.ay;
    ctx.fillStyle = 'rgba(255,255,255,.95)'; ctx.strokeStyle = c.color; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.roundRect(x, y, tw, th, th / 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#1d2433'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(label, c.ax, y + th / 2 + 1);
  }
  requestAnimationFrame(frame);
}

// ---- 参加用の URL / QR ----
fetch('/api/info').then(r => r.json()).then(d => {
  document.getElementById('url').textContent = d.answer_url;
  if (window.QRCode) new QRCode(document.getElementById('qr'), { text: d.answer_url, width: 168, height: 168 });
}).catch(() => {});

// F キー：全画面、S キー：右パネルの表示切替
document.addEventListener('keydown', e => {
  if (e.key === 'f' || e.key === 'F') {
    if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen?.();
  } else if (e.key === 's' || e.key === 'S') {
    document.body.classList.toggle('hide-side'); resize();
  }
});
window.addEventListener('resize', resize);
resize(); poll(); requestAnimationFrame(frame);
</script>
</body>
</html>
